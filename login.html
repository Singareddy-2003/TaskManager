<!-- sign up page  -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- external css -->
     <link rel="stylesheet" href="styles.css">
</head>
  <body>

    <div class="container">
        <div class="card shadow mx-auto my-5 text-light" style="width: 18rem; background-color: cornflowerblue;" >
            <h2 class="text-center my-2 p-3  ">Login</h2>
            <div class="card-body">
                
                <input type="text" placeholder="Enter username" id="lusername" class="form-control my-2">
                <input type="password" placeholder="Enter password" id="lpassword" class="form-control my-2">                
            </div>
            <button class="btn btn-dark mx-auto my-2" id="LoginBtn" style="width: 100px;">Login</button>


            <p class="text-center">Dont Have an Account<button class="btn" id="lsignupBtn">signup</button></p>
        </div>

    </div>

    

    <!-- extrernla script  -->
     <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
